[project]
name = "clearpath"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["agent", "detect", "localize", "eval", "faults", "mock_servicenow", "chaos"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# E501: `ruff format` owns line length; what it cannot wrap are string literals
# (LLM prompts, regexes, PromQL, table rows) where splitting hurts readability
# and, for prompts, would change the text sent to the model.
ignore = ["E501", "S101", "S311", "S603", "S607", "S310"]
