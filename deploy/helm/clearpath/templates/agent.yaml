apiVersion: apps/v1
kind: Deployment
metadata: {name: clearpath-agent, labels: {app: clearpath-agent}}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector: {matchLabels: {app: clearpath-agent}}
  template:
    metadata: {labels: {app: clearpath-agent}}
    spec:
      serviceAccountName: clearpath-agent
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: "{{ .Values.image.registry }}/clearpath-agent:{{ .Values.image.tag }}"
          args: ["serve"]
          env:
            - {name: CLEARPATH_LLM, value: {{ .Values.agent.llm | quote }}}
            - {name: CLEARPATH_VAR, value: /var/clearpath}
          envFrom: [{secretRef: {name: {{ .Values.agent.existingSecret }}, optional: true}}]
          ports: [{containerPort: 8000, name: http}]
          resources: {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: var, mountPath: /var/clearpath}]
      volumes: [{name: var, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: clearpath-agent}
spec:
  selector: {app: clearpath-agent}
  ports: [{port: 8000, targetPort: http, name: http}]
---
# Only the correlator may call the agent; the agent may egress to the API
# server, Prometheus/Loki, ServiceNow and the LLM endpoint (DNS allowed).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: clearpath-agent}
spec:
  podSelector: {matchLabels: {app: clearpath-agent}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: clearpath-correlator}}}]
      ports: [{port: 8000}]
