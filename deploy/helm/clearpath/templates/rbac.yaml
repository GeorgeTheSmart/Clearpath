# Least privilege for remediation: the agent may read and patch Deployments
# (rollout restart = patch of a template annotation; rollback = patch to a
# previous ReplicaSet's template) and set replicas via the scale subresource,
# in ONE namespace. No delete, no exec, no secrets, no cluster scope.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clearpath-agent
  annotations:
    # On EKS, IRSA binds this SA to the agent IAM role (infra/terraform/modules/iam).
    eks.amazonaws.com/role-arn: {{ .Values.agent.irsaRoleArn | default "" | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: clearpath-remediator, namespace: {{ .Values.targetNamespace }}}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # read-only: recent logs around an incident for the diagnosis context
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: clearpath-remediator, namespace: {{ .Values.targetNamespace }}}
subjects: [{kind: ServiceAccount, name: clearpath-agent, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: clearpath-remediator}
