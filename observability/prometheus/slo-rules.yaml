# SLOs as code for the user-facing edge (frontend), Google SRE workbook ch. 5
# "multiwindow, multi-burn-rate alerts".
#   Availability SLO: 99.9% of requests succeed over 30 days -> budget 0.001
#   Latency SLO:      99% of requests faster than 500 ms over 30 days -> budget 0.01
# Page when the burn rate is 14.4x over 1h AND 5m (2% of budget in 1 h),
# or 6x over 6h AND 30m (5% in 6 h). Ticket at 1x over 3d AND 6h.
# The short window makes the alert reset quickly once the burn stops.
#
# SLI source: the Linkerd proxy in front of each pod (observability/
# linkerd-podmonitor.yaml) measures every request, so the app needs no
# instrumentation. `inbound` = requests the frontend served; `classification`
# is Linkerd's success/failure verdict (HTTP 5xx, gRPC error, reset).
# rate() is taken per pod series BEFORE sum(): summing raw counters first would
# turn every pod restart (a counter reset) into a fake error spike.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clearpath-slo
  labels: {release: kube-prometheus-stack}
spec:
  groups:
    - name: slo:frontend:recording
      interval: 30s
      rules:
        # 1m: "is it healthy now?" (chaos recovery checks), not used for alerting
        - record: slo:frontend_error_ratio:rate1m
          expr: (sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[1m])) or vector(0)) / sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound"}[1m]))
        - record: slo:frontend_error_ratio:rate5m
          expr: (sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[5m])) or vector(0)) / sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound"}[5m]))
        - record: slo:frontend_error_ratio:rate30m
          expr: (sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[30m])) or vector(0)) / sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound"}[30m]))
        - record: slo:frontend_error_ratio:rate1h
          expr: (sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[1h])) or vector(0)) / sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound"}[1h]))
        - record: slo:frontend_error_ratio:rate6h
          expr: (sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[6h])) or vector(0)) / sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound"}[6h]))
        - record: slo:frontend_error_ratio:rate3d
          expr: (sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[3d])) or vector(0)) / sum(rate(response_total{namespace="boutique",service="frontend",direction="inbound"}[3d]))
        - record: slo:frontend_slow_ratio:rate5m
          expr: 1 - (sum(rate(response_latency_ms_bucket{namespace="boutique",service="frontend",direction="inbound",le=~"500|500.0"}[5m])) / sum(rate(response_latency_ms_count{namespace="boutique",service="frontend",direction="inbound"}[5m])))
        - record: slo:frontend_slow_ratio:rate30m
          expr: 1 - (sum(rate(response_latency_ms_bucket{namespace="boutique",service="frontend",direction="inbound",le=~"500|500.0"}[30m])) / sum(rate(response_latency_ms_count{namespace="boutique",service="frontend",direction="inbound"}[30m])))
        - record: slo:frontend_slow_ratio:rate1h
          expr: 1 - (sum(rate(response_latency_ms_bucket{namespace="boutique",service="frontend",direction="inbound",le=~"500|500.0"}[1h])) / sum(rate(response_latency_ms_count{namespace="boutique",service="frontend",direction="inbound"}[1h])))
        - record: slo:frontend_slow_ratio:rate6h
          expr: 1 - (sum(rate(response_latency_ms_bucket{namespace="boutique",service="frontend",direction="inbound",le=~"500|500.0"}[6h])) / sum(rate(response_latency_ms_count{namespace="boutique",service="frontend",direction="inbound"}[6h])))
        - record: slo:frontend_availability:budget_remaining_30d
          expr: 1 - ((sum(increase(response_total{namespace="boutique",service="frontend",direction="inbound",classification="failure"}[30d])) or vector(0)) / sum(increase(response_total{namespace="boutique",service="frontend",direction="inbound"}[30d]))) / 0.001
    - name: slo:frontend:alerts
      rules:
        - alert: FrontendAvailabilityBudgetBurnFast
          expr: slo:frontend_error_ratio:rate1h > (14.4 * 0.001) and slo:frontend_error_ratio:rate5m > (14.4 * 0.001)
          labels: {severity: page, service: frontend, slo: availability, clearpath: "true"}
          annotations:
            summary: "frontend is burning its 99.9% availability budget at >14.4x (2% of 30d budget per hour)"
            runbook_url: runbooks/alert-SLOBurn.md
        - alert: FrontendAvailabilityBudgetBurnSlow
          expr: slo:frontend_error_ratio:rate6h > (6 * 0.001) and slo:frontend_error_ratio:rate30m > (6 * 0.001)
          labels: {severity: page, service: frontend, slo: availability, clearpath: "true"}
          annotations:
            summary: "frontend availability budget burn >6x over 6h (5% of budget in 6h)"
            runbook_url: runbooks/alert-SLOBurn.md
        - alert: FrontendAvailabilityBudgetBurnTicket
          expr: slo:frontend_error_ratio:rate3d > (1 * 0.001) and slo:frontend_error_ratio:rate6h > (1 * 0.001)
          labels: {severity: ticket, service: frontend, slo: availability, clearpath: "true"}
          annotations:
            summary: "frontend availability budget burning faster than it accrues over 3 days"
            runbook_url: runbooks/alert-SLOBurn.md
        - alert: FrontendLatencyBudgetBurnFast
          expr: slo:frontend_slow_ratio:rate1h > (14.4 * 0.01) and slo:frontend_slow_ratio:rate5m > (14.4 * 0.01)
          labels: {severity: page, service: frontend, slo: latency, clearpath: "true"}
          annotations:
            summary: "frontend >500ms requests are burning the 99% latency budget at >14.4x"
            runbook_url: runbooks/alert-SLOBurn.md
        - alert: FrontendLatencyBudgetBurnSlow
          expr: slo:frontend_slow_ratio:rate6h > (6 * 0.01) and slo:frontend_slow_ratio:rate30m > (6 * 0.01)
          labels: {severity: page, service: frontend, slo: latency, clearpath: "true"}
          annotations:
            summary: "frontend latency budget burn >6x over 6h"
            runbook_url: runbooks/alert-SLOBurn.md
