# Symptom alerts per service. These mirror faults/sim.py STATIC_RULES/COVERAGE
# so the simulator and the cluster speak the same alert vocabulary. Every rule
# carries clearpath="true"; Alertmanager routes exactly those to the correlator
# (observability/kps-values.yaml) and drops the chart's built-in alerts.
#
# Every alert must carry a `service` label naming a topology node, because
# that is what the correlator groups on:
#   * request metrics come from the Linkerd proxies, labelled at scrape time;
#   * Kubernetes/cAdvisor series only have `pod`, so `service` is derived from
#     the Deployment pod name <deployment>-<replicaset-hash>-<suffix>.
# Linkerd's own containers are excluded so CPU/memory compare the app with
# the app's limits. The load generator lives in the same namespace but is the
# synthetic-traffic harness, not a service under management: it is excluded
# (it once raised a 'crash loop' incident just by being redeployed).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clearpath-symptoms
  labels: {release: kube-prometheus-stack}
spec:
  groups:
    - name: symptoms
      rules:
        - alert: HighLatencyP99
          # p99 over 5m vs the service's own p99 over the previous hour (sim: 2x
          # baseline); the 100 ms floor keeps near-idle services from paging on noise.
          # The baseline only counts if it saw comparable traffic (>= half today's
          # rate): an hour of mostly health probes (quiet period, load generator
          # restart, metrics just deployed) has a tiny p99 and fakes a regression.
          expr: |
            histogram_quantile(0.99, sum by (service, le) (rate(response_latency_ms_bucket{namespace="boutique",service!="loadgenerator",direction="inbound"}[5m])))
              > 2 * histogram_quantile(0.99, sum by (service, le) (rate(response_latency_ms_bucket{namespace="boutique",service!="loadgenerator",direction="inbound"}[1h] offset 10m)))
            and
            histogram_quantile(0.99, sum by (service, le) (rate(response_latency_ms_bucket{namespace="boutique",service!="loadgenerator",direction="inbound"}[5m]))) > 100
            and
            sum by (service) (rate(response_latency_ms_count{namespace="boutique",service!="loadgenerator",direction="inbound"}[1h] offset 10m))
              >= 0.5 * sum by (service) (rate(response_latency_ms_count{namespace="boutique",service!="loadgenerator",direction="inbound"}[5m]))
          for: 1m
          labels: {severity: warning, clearpath: "true"}
          annotations:
            summary: "p99 latency on {{ $labels.service }} is more than 2x its last-hour baseline"
            runbook_url: runbooks/HighLatencyP99.md
            service: "{{ $labels.service }}"
        - alert: HighErrorRate
          expr: |
            sum by (service) (rate(response_total{namespace="boutique",service!="loadgenerator",direction="inbound",classification="failure"}[5m]))
              / sum by (service) (rate(response_total{namespace="boutique",service!="loadgenerator",direction="inbound"}[5m])) > 0.05
          for: 1m
          labels: {severity: critical, clearpath: "true"}
          annotations:
            summary: "{{ $labels.service }} error rate above 5%"
            runbook_url: runbooks/HighErrorRate.md
            service: "{{ $labels.service }}"
        - alert: HighCPU
          expr: |
            sum by (service) (label_replace(rate(container_cpu_usage_seconds_total{namespace="boutique",pod!~"loadgenerator-.*",container!="",container!~"linkerd-.*"}[5m]), "service", "$1", "pod", "(.+)-[a-z0-9]+-[a-z0-9]{5}"))
              / sum by (service) (label_replace(kube_pod_container_resource_limits{namespace="boutique",pod!~"loadgenerator-.*",resource="cpu",container!~"linkerd-.*"}, "service", "$1", "pod", "(.+)-[a-z0-9]+-[a-z0-9]{5}")) > 0.85
          for: 1m
          labels: {severity: warning, clearpath: "true"}
          annotations:
            summary: "{{ $labels.service }} using more than 85% of its CPU limit"
            runbook_url: runbooks/HighCPU.md
            service: "{{ $labels.service }}"
        - alert: HighMemory
          expr: |
            sum by (service) (label_replace(container_memory_working_set_bytes{namespace="boutique",pod!~"loadgenerator-.*",container!="",container!~"linkerd-.*"}, "service", "$1", "pod", "(.+)-[a-z0-9]+-[a-z0-9]{5}"))
              / sum by (service) (label_replace(kube_pod_container_resource_limits{namespace="boutique",pod!~"loadgenerator-.*",resource="memory",container!~"linkerd-.*"}, "service", "$1", "pod", "(.+)-[a-z0-9]+-[a-z0-9]{5}")) > 0.9
          for: 1m
          labels: {severity: warning, clearpath: "true"}
          annotations:
            summary: "{{ $labels.service }} working set above 90% of its memory limit"
            runbook_url: runbooks/HighMemory.md
            service: "{{ $labels.service }}"
        - alert: PodCrashLooping
          expr: |
            max by (service) (label_replace(increase(kube_pod_container_status_restarts_total{namespace="boutique",pod!~"loadgenerator-.*",container!~"linkerd-.*"}[5m]), "service", "$1", "pod", "(.+)-[a-z0-9]+-[a-z0-9]{5}")) > 0
          labels: {severity: warning, clearpath: "true"}
          annotations:
            summary: "{{ $labels.service }} container restarted in the last 5 minutes"
            runbook_url: runbooks/PodCrashLooping.md
            service: "{{ $labels.service }}"
        - alert: TargetDown
          # No serving replica at all (killed, unschedulable, crash-looping),
          # rather than a scrape failure: that is what "down" means to callers.
          expr: |
            label_replace(kube_deployment_status_replicas_available{namespace="boutique",deployment!="loadgenerator"} == 0, "service", "$1", "deployment", "(.+)")
              and on(deployment) kube_deployment_spec_replicas{namespace="boutique",deployment!="loadgenerator"} > 0
          for: 1m
          labels: {severity: critical, clearpath: "true"}
          annotations:
            summary: "{{ $labels.service }} has no available replicas"
            runbook_url: runbooks/TargetDown.md
            service: "{{ $labels.service }}"
