grafana:
  sidecar:
    dashboards: {enabled: true, searchNamespace: ALL}
alertmanager:
  config:
    route:
      receiver: clearpath-correlator
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 30s
    receivers:
      - name: clearpath-correlator
        webhook_configs: [{url: "http://clearpath-correlator.clearpath.svc:8081/api/v1/alerts", send_resolved: true}]
prometheus:
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
