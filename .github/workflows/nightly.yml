name: nightly
on:
  schedule: [{cron: "17 21 * * *"}]   # 02:47 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eval-and-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - run: pip install -r requirements-dev.txt
      - run: make bench eval
      - uses: helm/kind-action@v1
        with: {config: deploy/kind.yaml}
      - run: make up-local
      - run: python chaos/run_suite.py --prom http://localhost:9090 --out eval/results/$(date -u +%F)
      - name: Commit results
        run: |
          git config user.name "clearpath-bot"; git config user.email "bot@users.noreply.github.com"
          git add eval/results README.md && git commit -m "nightly: eval + chaos results $(date -u +%F)" && git push || echo "no changes"
